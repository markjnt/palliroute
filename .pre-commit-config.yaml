# Run locally: pre-commit install
# All hooks:   pre-commit run --all-files
# Same checks as .github/workflows/ci.yml (backend ruff + frontend lint/format).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-prettier
        name: prettier (frontend)
        entry: bash -c 'rel=(); for f in "$@"; do rel+=("${f#frontend/}"); done; cd frontend && npx prettier --write --ignore-unknown --config .prettierrc --ignore-path .prettierignore "${rel[@]}"' --
        language: system
        files: ^frontend/

      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
