services:
  postgres:
    image: postgres:16-alpine
    container_name: palliroute-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-palliroute}
      POSTGRES_USER: ${POSTGRES_USER:-palliroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-palliroute} -d ${POSTGRES_DB:-palliroute}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  backend-api:
    image: markjnt/palliroute-backend-api
    container_name: palliroute-backend-api
    pull_policy: always
    volumes:
      - ./backend/data:/backend/data
      - ${EXCEL_IMPORT_PATH}:/backend/data/excel_import
      - ${EXPORT_PALLIDOC_PATH}:/backend/data/excel_import/Export_PalliDoc
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-palliroute}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-palliroute}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APLANO_API_KEY=${APLANO_API_KEY}
      - HOLIDAY_STATE=${HOLIDAY_STATE}
      - HOLIDAY_API_BASE_URL=${HOLIDAY_API_BASE_URL}
    expose:
      - "9000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  backend-scheduler:
    image: markjnt/palliroute-backend-scheduler
    container_name: palliroute-backend-scheduler
    pull_policy: always
    volumes:
      - ${EXCEL_IMPORT_PATH}:/scheduler/data/excel_import
      - ${EXPORT_PALLIDOC_PATH}:/scheduler/data/excel_import/Export_PalliDoc
    environment:
      - AUTO_IMPORT_ENABLED=${AUTO_IMPORT_ENABLED}
      - AUTO_IMPORT_TIMES=${AUTO_IMPORT_TIMES}
      - BACKEND_API_URL=http://backend-api:9000
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend-api

  frontend-web:
    image: markjnt/palliroute-frontend-web
    container_name: palliroute-frontend-web
    pull_policy: always
    expose:
      - "3000"
    depends_on:
      - backend-api
    restart: unless-stopped
    networks:
      - app-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.services.web.loadbalancer.server.scheme=http"

  frontend-pwa:
    image: markjnt/palliroute-frontend-pwa
    container_name: palliroute-frontend-pwa
    pull_policy: always
    ports:
      - "3001:3001"
    depends_on:
      - backend-api
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public

volumes:
  postgres-data:
