name: palliroute-${STAGE:-prod}

services:
  postgres:
    image: postgres:16-alpine
    container_name: palliroute-${STAGE:-prod}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-palliroute}
      POSTGRES_USER: ${POSTGRES_USER:-palliroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-palliroute} -d ${POSTGRES_DB:-palliroute}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  backend-api:
    image: markjnt/palliroute-backend-api:${STAGE:-prod}
    container_name: palliroute-${STAGE:-prod}-backend-api
    pull_policy: always
    volumes:
      - ./backend/data:/backend/data
      - ${EXCEL_IMPORT_PATH}:/backend/data/excel_import
      - ${EXPORT_PALLIDOC_PATH}:/backend/data/excel_import/Export_PalliDoc
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-palliroute}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-palliroute}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - APLANO_API_KEY=${APLANO_API_KEY}
      - HOLIDAY_STATE=${HOLIDAY_STATE:-NW}
      - HOLIDAY_API_BASE_URL=${HOLIDAY_API_BASE_URL:-https://feiertage-api.de/api/}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - ENTRA_EMAIL_DOMAIN=${ENTRA_EMAIL_DOMAIN:-sapv-oberberg.de}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  backend-scheduler:
    image: markjnt/palliroute-backend-scheduler:${STAGE:-prod}
    container_name: palliroute-${STAGE:-prod}-backend-scheduler
    pull_policy: always
    volumes:
      - ${EXCEL_IMPORT_PATH}:/scheduler/data/excel_import
      - ${EXPORT_PALLIDOC_PATH}:/scheduler/data/excel_import/Export_PalliDoc
    environment:
      - AUTO_IMPORT_ENABLED=${AUTO_IMPORT_ENABLED}
      - AUTO_IMPORT_TIMES=${AUTO_IMPORT_TIMES}
      - BACKEND_API_URL=http://backend-api:9000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      backend-api:
        condition: service_healthy

  frontend-web:
    image: markjnt/palliroute-frontend-web:${STAGE:-prod}
    container_name: palliroute-${STAGE:-prod}-frontend-web
    pull_policy: always
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.web-${STAGE:-prod}.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.web-${STAGE:-prod}.entrypoints=websecure"
      - "traefik.http.routers.web-${STAGE:-prod}.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-${STAGE:-prod}.loadbalancer.server.port=3000"
      - "traefik.http.services.web-${STAGE:-prod}.loadbalancer.server.scheme=http"

  frontend-pwa:
    image: markjnt/palliroute-frontend-pwa:${STAGE:-prod}
    container_name: palliroute-${STAGE:-prod}-frontend-pwa
    pull_policy: always
    expose:
      - "3001"
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.pwa-${STAGE:-prod}.rule=Host(`${PWA_DOMAIN}`)"
      - "traefik.http.routers.pwa-${STAGE:-prod}.entrypoints=web"
      - "traefik.http.services.pwa-${STAGE:-prod}.loadbalancer.server.port=3001"
      - "traefik.http.services.pwa-${STAGE:-prod}.loadbalancer.server.scheme=http"

networks:
  app-network:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public

volumes:
  postgres-data:
