name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      stage:
        description: Target stage
        required: true
        type: choice
        options:
          - prod
          - dev

concurrency:
  group: cd-${{ inputs.stage || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      stage: ${{ steps.meta.outputs.stage }}
      deploy_dir: ${{ steps.meta.outputs.deploy_dir }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Resolve stage
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STAGE="${{ inputs.stage }}"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            case "$BRANCH" in
              main) STAGE=prod ;;
              dev) STAGE=dev ;;
              *)
                echo "Unsupported branch for CD: $BRANCH"
                exit 1
                ;;
            esac
          fi

          case "$STAGE" in
            prod) DEPLOY_DIR=palliroute ;;
            dev) DEPLOY_DIR=palliroute-dev ;;
            *)
              echo "Unknown stage: $STAGE"
              exit 1
              ;;
          esac

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=$DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "Deploy stage=$STAGE dir=~/$DEPLOY_DIR sha=$IMAGE_SHA"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Load image matrix
        id: matrix
        run: |
          echo "images=$(jq -c . .github/docker-images.json)" >> "$GITHUB_OUTPUT"

  build-push:
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.gate.outputs.images) }}
    env:
      STAGE: ${{ needs.gate.outputs.stage }}
      IMAGE: markjnt/palliroute-${{ matrix.name }}
      CACHE: docker.io/markjnt/palliroute-${{ matrix.name }}:buildcache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        if: matrix.target != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}
            ${{ env.IMAGE }}:${{ env.STAGE }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max
          provenance: false
          sbom: false

      - name: Build image (default target)
        if: matrix.target == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_SHA }}
            ${{ env.IMAGE }}:${{ env.STAGE }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max
          provenance: false
          sbom: false

      - name: Push image
        run: |
          docker push "${{ env.IMAGE }}:${{ env.IMAGE_SHA }}"
          docker push "${{ env.IMAGE }}:${{ env.STAGE }}"
          if [ "${{ env.STAGE }}" = "prod" ]; then
            docker tag "${{ env.IMAGE }}:${{ env.STAGE }}" "${{ env.IMAGE }}:latest"
            docker push "${{ env.IMAGE }}:latest"
          fi

  deploy:
    runs-on: self-hosted
    needs: [gate, build-push]
    env:
      DEPLOY_DIR: ${{ needs.gate.outputs.deploy_dir }}
      STAGE: ${{ needs.gate.outputs.stage }}
    steps:
      - name: Validate compose configuration
        run: docker compose -f "$HOME/$DEPLOY_DIR/docker-compose.yml" --env-file "$HOME/$DEPLOY_DIR/.env" config

      - name: Pull and restart services
        run: |
          cd "$HOME/$DEPLOY_DIR"
          echo "Deploying stage=$STAGE to $HOME/$DEPLOY_DIR"
          docker compose pull
          docker compose up -d
          docker image prune -f
