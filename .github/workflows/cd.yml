name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Verify CI status
        run: echo "Proceeding with deployment for ${IMAGE_TAG}"

  build-scan-push:
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-api
            file: docker/backend.Dockerfile
            target: main
            image: markjnt/palliroute-backend-api
            cache: docker.io/markjnt/palliroute-backend-api:buildcache
          - name: backend-scheduler
            file: docker/backend.Dockerfile
            target: scheduler-image
            image: markjnt/palliroute-backend-scheduler
            cache: docker.io/markjnt/palliroute-backend-scheduler:buildcache
          - name: frontend-web
            file: docker/frontend_web.Dockerfile
            target: ""
            image: markjnt/palliroute-frontend-web
            cache: docker.io/markjnt/palliroute-frontend-web:buildcache
          - name: frontend-pwa
            file: docker/frontend_pwa.Dockerfile
            target: ""
            image: markjnt/palliroute-frontend-pwa
            cache: docker.io/markjnt/palliroute-frontend-pwa:buildcache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        if: matrix.target != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: |
            ${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ matrix.cache }}
          cache-to: type=registry,ref=${{ matrix.cache }},mode=max
          provenance: false
          sbom: false

      - name: Build image (default target)
        if: matrix.target == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: |
            ${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ matrix.cache }}
          cache-to: type=registry,ref=${{ matrix.cache }},mode=max
          provenance: false
          sbom: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output: sbom-${{ matrix.name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90

      - name: Push image
        run: |
          docker push "${{ matrix.image }}:${{ env.IMAGE_TAG }}"
          docker push "${{ matrix.image }}:latest"

  deploy:
    runs-on: self-hosted
    needs: build-scan-push
    steps:
      - name: Validate compose configuration
        run: docker compose -f "$HOME/palliroute/docker-compose.yml" config

      - name: Pull and restart services
        run: |
          cd "$HOME/palliroute"
          docker compose pull
          docker compose up -d
          docker image prune -f
