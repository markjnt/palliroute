name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      github: ${{ steps.filter.outputs.github }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/pyproject.toml'
            frontend:
              - 'frontend/**'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - '.dockerignore'
              - '.github/docker-images.json'
            github:
              - '.github/**'

  backend-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.github == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format
        run: ruff format --check backend
      - name: Import smoke test
        run: python -m compileall backend/app
      - name: Unit tests
        run: |
          if find backend -path '*/tests/test_*.py' | grep -q .; then
            pytest backend/tests --tb=short -q
          else
            echo "::notice::No unit tests yet — skipping pytest"
          fi
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt

  frontend-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.github == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: |
          if find . \( -path ./node_modules -o -path ./dist \) -prune -o \
            \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
            -print | grep -q .; then
            npm test
          else
            echo "::notice::No unit tests yet — skipping vitest"
          fi
      - name: Dependency audit
        run: npm audit --audit-level=high

  docker-matrix:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.github == 'true'
    outputs:
      images: ${{ steps.set.outputs.images }}
      dockerfiles: ${{ steps.set.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        run: |
          echo "images=$(jq -c . .github/docker-images.json)" >> "$GITHUB_OUTPUT"
          echo "dockerfiles=$(jq -c '[.[].file] | unique' .github/docker-images.json)" >> "$GITHUB_OUTPUT"

  docker-lint:
    runs-on: ubuntu-latest
    needs: [changes, docker-matrix]
    if: |
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.github == 'true'
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.docker-matrix.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  docker-ci:
    runs-on: ubuntu-latest
    needs: [changes, docker-matrix, docker-lint]
    if: |
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.github == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.docker-matrix.outputs.images) }}
    env:
      IMAGE_TAG: palliroute-${{ matrix.name }}:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Refresh OS package layers at most once per UTC day; npm/pip layers stay cached.
      - name: OS security cache bust
        id: os-sec
        run: echo "bust=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: matrix.target != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            OS_SEC_UPDATE=${{ steps.os-sec.outputs.bust }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

      - name: Build image (default target)
        if: matrix.target == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            OS_SEC_UPDATE=${{ steps.os-sec.outputs.bust }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

      # ignore-unfixed: true — CVEs without an available patch are excluded from the gate.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.71.2
          scan-type: image
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          ignore-unfixed: true
          scanners: vuln
          list-all-pkgs: true
          exit-code: 0

      - name: Generate reports and gate on findings
        if: always() && hashFiles('trivy-results.json') != ''
        run: |
          trivy convert --format sarif --severity CRITICAL,HIGH \
            --output trivy-results.sarif trivy-results.json
          trivy convert --format spdx-json \
            --output "sbom-${{ matrix.name }}.spdx.json" trivy-results.json
          trivy convert --format table --severity CRITICAL,HIGH --scanners vuln \
            --output trivy-results.txt trivy-results.json

          {
            echo "### Trivy: \`${{ matrix.name }}\`"
            echo ""
            if [[ -s trivy-results.txt ]]; then
              echo '```'
              cat trivy-results.txt
              echo '```'
            else
              echo "No CRITICAL/HIGH findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job on CRITICAL/HIGH (same gate as before)
          trivy convert --format table --severity CRITICAL,HIGH --scanners vuln \
            --exit-code 1 trivy-results.json

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.name }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('sbom-${{ matrix.name }}.spdx.json') != '' }}
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90

  security-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Always runs so branch protection can require this single check.
  # Path-filtered jobs may be "skipped"; that counts as OK here.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - backend-ci
      - frontend-ci
      - docker-matrix
      - docker-lint
      - docker-ci
      - security-ci
    steps:
      - name: Verify CI jobs
        run: |
          results=(
            "changes:${{ needs.changes.result }}"
            "backend-ci:${{ needs.backend-ci.result }}"
            "frontend-ci:${{ needs.frontend-ci.result }}"
            "docker-matrix:${{ needs.docker-matrix.result }}"
            "docker-lint:${{ needs.docker-lint.result }}"
            "docker-ci:${{ needs.docker-ci.result }}"
            "security-ci:${{ needs.security-ci.result }}"
          )
          failed=0
          for entry in "${results[@]}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            echo "$name → $result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name finished with $result"
                failed=1
                ;;
            esac
          done
          exit "$failed"
