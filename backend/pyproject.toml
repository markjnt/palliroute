[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]
"run.py" = ["E402"]
"run_scheduler.py" = ["E402"]
"app/services/pdf_generator.py" = ["B023"]
"app/services/auto_planning_service.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
